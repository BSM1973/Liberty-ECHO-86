name: ECHO 86 macOS AU VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "JUCE/**"
      - ".github/workflows/echo86-macos-build.yml"
      - "Installers/macOS/**"
jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout ECHO 86
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.10
          path: .juce-sdk
      - name: Configure
        run: cmake -S JUCE -B build -DJUCE_DIR="$GITHUB_WORKSPACE/.juce-sdk" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          for ext in component vst3 app; do
            find build -type d -name "*.${ext}" -print -quit | grep -q . || {
              echo "::error::Missing .${ext} bundle"
              exit 1
            }
          done
      - name: Prepare Apple Developer ID (optional; never request secrets in logs)
        shell: bash
        env:
          APP_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          if [[ -n "$APP_P12_B64" ]]; then count=$((count+1)); fi
          if [[ -n "$INSTALLER_P12_B64" ]]; then count=$((count+1)); fi
          if [[ -n "$P12_PASSWORD" ]]; then count=$((count+1)); fi
          if [[ "$count" -eq 0 ]]; then
            echo "ECHO86_DEVELOPER_ID_READY=false" >> "$GITHUB_ENV"
            echo "::notice::Developer ID secrets not yet configured: unsigned test installer will be built."
            exit 0
          fi
          if [[ "$count" -ne 3 ]]; then
            echo "::error::Add all three Apple certificate secrets, or none."
            exit 1
          fi
          keychain="$RUNNER_TEMP/echo86-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          printf "%s" "$APP_P12_B64" | base64 -D > "$RUNNER_TEMP/echo86-app.p12"
          printf "%s" "$INSTALLER_P12_B64" | base64 -D > "$RUNNER_TEMP/echo86-installer.p12"
          security import "$RUNNER_TEMP/echo86-app.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/echo86-installer.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          app_identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          installer_identity="$(security find-identity -v "$keychain" | awk -F '"' '/Developer ID Installer/{print $2; exit}')"
          if [[ -z "$app_identity" || -z "$installer_identity" ]]; then
            echo "::error::Developer ID Application and Developer ID Installer identities must both be present."
            exit 1
          fi
          echo "ECHO86_APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "ECHO86_INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          echo "ECHO86_DEVELOPER_ID_READY=true" >> "$GITHUB_ENV"
          echo "::notice::Developer ID certificates imported; binaries and .pkg will be signed."
          rm -f "$RUNNER_TEMP/echo86-app.p12" "$RUNNER_TEMP/echo86-installer.p12"
      - name: Package macOS bundles without losing permissions
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ECHO86-macOS"
          mkdir -p "$stage/Components" "$stage/VST3" "$stage/Standalone"
          for item in "component:Components" "vst3:VST3" "app:Standalone"; do
            ext="${item%%:*}"
            folder="${item#*:}"
            bundle="$(find build -type d -name "*.${ext}" -print -quit)"
            test -n "$bundle" || { echo "::error::Missing .${ext} bundle"; exit 1; }
            echo "Signing complete ${ext} bundle: $bundle"
            /usr/bin/xattr -dr com.apple.quarantine "$bundle" 2>/dev/null || true
            if [[ "$ECHO86_DEVELOPER_ID_READY" == "true" ]]; then
              /usr/bin/codesign --force --deep --options runtime --timestamp \
                --sign "$ECHO86_APP_IDENTITY" "$bundle"
            else
              /usr/bin/codesign --force --deep --sign - "$bundle"
            fi
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
            /usr/bin/ditto "$bundle" "$stage/$folder/$(basename "$bundle")"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$stage/$folder/$(basename "$bundle")"
          done
          cat > "$stage/INSTALLATION.txt" <<'TEXT'
          ECHO 86 — macOS Apple Silicon
          --------------------------------
          This archive preserves macOS plugin executable permissions, symlinks and local ad-hoc signatures.

          AU: copy "Components/ECHO 86.component" into ~/Library/Audio/Plug-Ins/Components/
          VST3: copy "VST3/ECHO 86.vst3" into ~/Library/Audio/Plug-Ins/VST3/
          Standalone: "Standalone/ECHO 86.app"

          macOS may quarantine unsigned downloaded files. After copying, if necessary:
            xattr -dr com.apple.quarantine "$HOME/Library/Audio/Plug-Ins/Components/ECHO 86.component"

          Close and reopen your DAW to rescan plugins.
          These bundles use local ad-hoc signing; they are not Apple notarized.
          TEXT
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$stage" "$GITHUB_WORKSPACE/ECHO86-macOS-bundles.zip"
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/ECHO86-macOS-bundles.zip"
          # Round-trip verification: extracted archives must still pass macOS code-sign checks.
          mkdir -p "$RUNNER_TEMP/ECHO86-verify"
          /usr/bin/ditto -x -k "$GITHUB_WORKSPACE/ECHO86-macOS-bundles.zip" "$RUNNER_TEMP/ECHO86-verify"
          unpacked="$RUNNER_TEMP/ECHO86-verify/ECHO86-macOS"
          for item in "component:Components" "vst3:VST3" "app:Standalone"; do
            ext="${item%%:*}"
            folder="${item#*:}"
            bundle="$(find "$unpacked/$folder" -type d -name "*.${ext}" -print -quit)"
            test -n "$bundle" || { echo "::error::Archive is missing .${ext}"; exit 1; }
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
            echo "Verified extracted ${ext} bundle: $bundle"
          done

      - name: Build macOS one-click installer and optionally notarize
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash Installers/macOS/package.sh

      - name: Upload unsigned macOS test installer (.pkg)
        if: env.ECHO86_DEVELOPER_ID_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ECHO86-macOS-Installer-TEST-unsigned
          path: ECHO86-macOS-Installer.pkg
          if-no-files-found: error
          compression-level: 0

      - name: Upload signed but unnotarized macOS installer (.pkg)
        if: env.ECHO86_DEVELOPER_ID_READY == 'true' && env.ECHO86_NOTARIZED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ECHO86-macOS-Installer-DeveloperID
          path: ECHO86-macOS-Installer.pkg
          if-no-files-found: error
          compression-level: 0

      - name: Upload Apple signed and notarized macOS installer (.pkg)
        if: env.ECHO86_NOTARIZED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ECHO86-macOS-Installer-SIGNED-NOTARIZED
          path: ECHO86-macOS-Installer.pkg
          if-no-files-found: error
          compression-level: 0
      - name: Upload preserved macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ECHO86-macOS-preserved
          path: ECHO86-macOS-bundles.zip
          if-no-files-found: error
          compression-level: 0

  linux-dsp-tests:
    name: Verify DSP on Linux (independent of macOS runner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ECHO 86
        uses: actions/checkout@v4
      - name: Compile and execute all C++ DSP and LFO tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/echo86-tests
          for test in test_core test_midi_v43 test_polyphony16_v44 test_advanced_v45 test_effects_v46 test_presets_v47 test_100_presets_v48 test_native_ui_dsp test_lfo_waveform test_ui_localization; do
            echo "::group::${test}"
            c++ -std=c++17 -O2 "JUCE/Source/${test}.cpp" -o "/tmp/echo86-tests/${test}"
            "/tmp/echo86-tests/${test}"
            echo "::endgroup::"
          done
