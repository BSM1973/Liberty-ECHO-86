name: ECHO 86 macOS AU VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "JUCE/**"
      - ".github/workflows/echo86-macos-build.yml"
jobs:
  macos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout ECHO 86
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.10
          path: .juce-sdk
      - name: Configure
        run: cmake -S JUCE -B build -DJUCE_DIR="$GITHUB_WORKSPACE/.juce-sdk" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          for ext in component vst3 app; do
            find build -type d -name "*.${ext}" -print -quit | grep -q . || {
              echo "::error::Missing .${ext} bundle"
              exit 1
            }
          done
      - name: Upload unsigned plugins
        uses: actions/upload-artifact@v4
        with:
          name: ECHO86-macOS-unsigned
          path: |
            build/**/*.component/**
            build/**/*.vst3/**
            build/**/*.app/**
          if-no-files-found: error

  linux-dsp-tests:
    name: Verify DSP on Linux (independent of macOS runner)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ECHO 86
        uses: actions/checkout@v4
      - name: Compile and execute seven C++ DSP tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/echo86-tests
          for test in test_core test_midi_v43 test_polyphony16_v44 test_advanced_v45 test_effects_v46 test_presets_v47 test_100_presets_v48; do
            echo "::group::${test}"
            c++ -std=c++17 -O2 "JUCE/Source/${test}.cpp" -o "/tmp/echo86-tests/${test}"
            "/tmp/echo86-tests/${test}"
            echo "::endgroup::"
          done
