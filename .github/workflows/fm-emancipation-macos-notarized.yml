name: FM Emancipation - Liberty Release Center Apple Notarized Installer
run-name: FM Emancipation 0.3.1 - Apple Developer ID signed and notarized
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fm-emancipation-macos-notarized.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: liberty-release-center-fm-emancipation
  cancel-in-progress: false
env:
  FM_EMANCIPATION_SOURCE_SHA: '2f2294c06ea3bd74a49c5d560176415de5d869c5'
  FM_EMANCIPATION_VERSION: '0.3.1'
jobs:
  mac-build:
    name: Compile pinned FM Emancipation AU/VST3 and validate without Apple secrets
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - name: Checkout trusted Liberty Release Center
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact FM Emancipation source commit
        uses: actions/checkout@v4
        with:
          repository: BSM1973/FM-Emancipation
          ref: ${{ env.FM_EMANCIPATION_SOURCE_SHA }}
          path: plugin-src
          persist-credentials: false
      - name: Verify immutable release source and UI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C plugin-src rev-parse HEAD)" = "$FM_EMANCIPATION_SOURCE_SHA"
          grep -Fq 'project(FMEmancipation VERSION 0.3.1' plugin-src/CMakeLists.txt
          python3 plugin-src/tools/check_unicode.py
          bash -n ReleaseCenter/macos/preserve.sh
          bash -n ReleaseCenter/macos/sign_notarize.sh
      - name: Configure macOS Universal x86_64 + arm64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S plugin-src -B build -G Xcode \
            '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_BUILD_TYPE=Release
      - name: Compile AU/VST3 and all unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release --output-on-failure
      - name: Validate Audio Unit instrument (native runner architecture)
        shell: bash
        run: |
          set -euo pipefail
          component="build/FMEmancipation_artefacts/Release/AU/FM Emancipation.component"
          test -d "$component"
          /usr/bin/codesign --force --deep --sign - "$component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          /usr/bin/ditto "$component" "$HOME/Library/Audio/Plug-Ins/Components/FM Emancipation.component"
          /usr/bin/killall -9 AudioComponentRegistrar 2>/dev/null || true
          /usr/bin/auval -v aumu FME1 BSM1
      - name: Preserve FM Emancipation AU/VST3 in signed-safe archives
        shell: bash
        env:
          LIBERTY_PRODUCT_NAME: FM Emancipation
          LIBERTY_TARGET: FMEmancipation
        run: bash ReleaseCenter/macos/preserve.sh
      - name: Transfer only validated plugin binary bundles
        uses: actions/upload-artifact@v4
        with:
          name: fm-emancipation-validated-unsigned-bundles
          path: exported-mac/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  apple-notarization:
    name: Sign, Apple notarize, staple and verify FM Emancipation installer
    needs: mac-build
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - name: Checkout trusted existing Liberty Release Center scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download compiled and tested AU/VST3
        uses: actions/download-artifact@v4
        with:
          name: fm-emancipation-validated-unsigned-bundles
          path: incoming
      - name: Use previously validated ECHO 86 Apple notarization tool
        shell: bash
        env:
          LIBERTY_PRODUCT_NAME: FM Emancipation
          LIBERTY_SLUG: fm-emancipation
          LIBERTY_VERSION: '0.3.1'
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash ReleaseCenter/macos/sign_notarize.sh
      - name: Publish only Apple Accepted and stapled installer
        id: published
        uses: actions/upload-artifact@v4
        with:
          name: FM-Emancipation-v0.3.1-macOS-SIGNED-NOTARIZED-PKG
          path: release-output/LIBERTY-fm-emancipation-macOS-Universal-v0.3.1-SIGNED-NOTARIZED.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Redownload actual published PKG
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.published.outputs.artifact-id }}
          path: verified-macos
          merge-multiple: true
      - name: Verify the exact downloadable signed and stapled installer
        shell: bash
        run: |
          set -euo pipefail
          pkg='verified-macos/LIBERTY-fm-emancipation-macOS-Universal-v0.3.1-SIGNED-NOTARIZED.pkg'
          test -s "$pkg"
          /usr/sbin/pkgutil --check-signature "$pkg"
          /usr/bin/xcrun stapler validate "$pkg"
          /usr/sbin/spctl --assess --type install --verbose=2 "$pkg"
          shasum -a 256 "$pkg"
