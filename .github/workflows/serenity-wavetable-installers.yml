name: SERENITY WAVETABLE — Liberty Release Center two installers
run-name: Serenity WAVETABLE 1.2.12 — Apple notarized PKG and Windows VST3 EXE

# Pinned CI-green Serenity source; signing secrets isolated from compilation.
# Functional validation does not certify maximum-polyphony realtime deadlines.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/serenity-wavetable-installers.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: liberty-serenity-wavetable-notarized-installers
  cancel-in-progress: false

env:
  SERENITY_SOURCE_SHA: 3d4ec872aadf95b803ce038a8c170e9160ebd007
  SERENITY_VERSION: '1.2.12'

jobs:
  mac-build:
    name: Build Serenity WAVETABLE macOS Universal AU and VST3 (without secrets)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout the trusted Liberty Release Center
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Serenity WAVETABLE source
        uses: actions/checkout@v4
        with:
          repository: BSM1973/Liberty-Serenity-Wavetable
          ref: ${{ env.SERENITY_SOURCE_SHA }}
          path: plugin-src
          persist-credentials: false
      - name: Validate exact pinned source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C plugin-src rev-parse HEAD)" = "$SERENITY_SOURCE_SHA"
          grep -Fq 'project(SerenityWavetable VERSION 1.2.12' plugin-src/CMakeLists.txt
          bash -n ReleaseCenter/macos/preserve.sh
          bash -n ReleaseCenter/macos/sign_notarize.sh
      - name: Configure universal macOS plugin
        shell: bash
        run: |
          set -euo pipefail
          cmake -S plugin-src -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DBUILD_TESTING=ON
      - name: Compile AU/VST3 and run native DSP and endurance tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release --output-on-failure --timeout 1800
      - name: Validate Audio Unit with Apple auval
        shell: bash
        run: |
          set -euo pipefail
          source="build/SerenityWavetable_artefacts/Release/AU/Serenity WAVETABLE.component"
          target="$HOME/Library/Audio/Plug-Ins/Components/Serenity WAVETABLE.component"
          mkdir -p "$(dirname "$target")"
          /usr/bin/ditto "$source" "$target"
          /usr/bin/codesign --force --deep --sign - "$target"
          /usr/bin/codesign --verify --deep "$target"
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          sleep 4
          /usr/bin/auval -v aumu SrWt LbMs
      - name: Validate real VST3 with pluginval
        uses: Tracktion/pluginval/validate@286684f72062250fd2494681b7ebdcb721f09e0d
        with:
          pluginval-version: v2.0.0-beta3
          plugins: |
            build/SerenityWavetable_artefacts/Release/VST3/*.vst3
          strictness-level: '5'
          args: '--skip-gui-tests --timeout-ms 120000'
      - name: Preserve universal AU and VST3 using Release Center
        shell: bash
        env:
          LIBERTY_PRODUCT_NAME: Serenity WAVETABLE
          LIBERTY_TARGET: SerenityWavetable
        run: bash ReleaseCenter/macos/preserve.sh
      - name: Transfer only compiled bundles into the isolated Apple signing job
        uses: actions/upload-artifact@v4
        with:
          name: serenity-wavetable-unsigned-validated-bundles
          path: exported-mac/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  apple-sign-notarize:
    name: Developer ID signed, Apple Accepted and stapled PKG
    needs: mac-build
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout only the trusted Release Center scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download compiled validated AU and VST3
        uses: actions/download-artifact@v4
        with:
          name: serenity-wavetable-unsigned-validated-bundles
          path: incoming
      - name: Reuse Organix/BOOM Apple Developer ID and notarization automation
        shell: bash
        env:
          LIBERTY_PRODUCT_NAME: Serenity WAVETABLE
          LIBERTY_SLUG: serenity-wavetable
          LIBERTY_VERSION: '1.2.12'
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash ReleaseCenter/macos/sign_notarize.sh
      - name: Publish only Apple-Accepted and stapled test installer
        id: pkg
        uses: actions/upload-artifact@v4
        with:
          name: LIBERTY-serenity-wavetable-macOS-SIGNED-NOTARIZED-QA
          path: release-output/LIBERTY-serenity-wavetable-macOS-Universal-v1.2.12-SIGNED-NOTARIZED.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Re-download published PKG and check Gatekeeper and stapled ticket
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.pkg.outputs.artifact-id }}
          path: verified-mac
          merge-multiple: true
      - name: Verify exact Apple signed installer
        shell: bash
        run: |
          set -euo pipefail
          pkg=verified-mac/LIBERTY-serenity-wavetable-macOS-Universal-v1.2.12-SIGNED-NOTARIZED.pkg
          test -s "$pkg"
          /usr/sbin/pkgutil --check-signature "$pkg"
          /usr/bin/xcrun stapler validate "$pkg"
          /usr/sbin/spctl --assess --type install --verbose=2 "$pkg"
          shasum -a 256 "$pkg" | tee -a "$GITHUB_STEP_SUMMARY"

  windows-build:
    name: Build Windows x64 VST3/Standalone and Inno Setup EXE (unsigned)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout the trusted Liberty Release Center
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout same pinned Serenity WAVETABLE source
        uses: actions/checkout@v4
        with:
          repository: BSM1973/Liberty-Serenity-Wavetable
          ref: ${{ env.SERENITY_SOURCE_SHA }}
          path: plugin-src
          persist-credentials: false
      - name: Verify correct source revision and plugin version
        shell: pwsh
        run: |
          $sha = git -C plugin-src rev-parse HEAD
          if ($sha -ne $env:SERENITY_SOURCE_SHA) { throw "Wrong release commit" }
          if (!(Select-String -LiteralPath plugin-src/CMakeLists.txt -Pattern 'project\(SerenityWavetable VERSION 1\.2\.12')) { throw 'Wrong source version' }
      - name: Compile Windows VST3 and run native tests
        shell: pwsh
        run: |
          cmake -S plugin-src -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Validate Windows VST3 using pluginval
        uses: Tracktion/pluginval/validate@286684f72062250fd2494681b7ebdcb721f09e0d
        with:
          pluginval-version: v2.0.0-beta3
          plugins: |
            build/SerenityWavetable_artefacts/Release/VST3/*.vst3
          strictness-level: '5'
          args: '--skip-gui-tests --timeout-ms 120000'
      - name: Build VST3 and standalone .exe through the existing Release Center
        shell: pwsh
        env:
          LIBERTY_PRODUCT_NAME: Serenity WAVETABLE
          LIBERTY_TARGET: SerenityWavetable
          LIBERTY_SLUG: serenity-wavetable
          LIBERTY_VERSION: '1.2.12'
          LIBERTY_STANDALONE: 'true'
        run: ./ReleaseCenter/windows/build.ps1
      - name: Publish Windows VST3 and standalone Setup.exe (not Authenticode signed)
        id: published
        uses: actions/upload-artifact@v4
        with:
          name: LIBERTY-serenity-wavetable-Windows-x64-EXE-UNSIGNED-QA
          path: release-output/LIBERTY-serenity-wavetable-Windows-x64-v1.2.12-UNSIGNED.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Download actual published Windows EXE
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.published.outputs.artifact-id }}
          path: verified-windows
          merge-multiple: true
      - name: Compare uploaded installer SHA256 with compiled source
        shell: pwsh
        run: |
          $name='LIBERTY-serenity-wavetable-Windows-x64-v1.2.12-UNSIGNED.exe'
          $src=Join-Path release-output $name
          $dst=Join-Path verified-windows $name
          if (!(Test-Path -LiteralPath $dst)) { throw 'Published installer missing' }
          $srcHash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
          $dstHash=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash
          if ($srcHash -ne $dstHash) { throw 'Published Windows EXE hash mismatch' }
          "Windows installer SHA256: $dstHash" | Out-File -Append $env:GITHUB_STEP_SUMMARY
